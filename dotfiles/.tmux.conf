# Enable true color (24-bit RGB)
set -ga terminal-overrides ",xterm-256color:RGB"

# Enable mouse mode
set -g mouse on

# Enable extended keys
set -g extended-keys on
set -g extended-keys-format csi-u

# Vi mode
setw -g mode-keys vi

# List of plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "dracula/tmux"
set -g @plugin "sainnhe/tmux-fzf"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-pain-control"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

# Available Dracula widgets: attached-clients, battery, compact-alt, continuum, cpu-arch, cpu-usage, cwd, fossil, git, GPU Info (gpu-usage, gpu-ram-usage, gpu-power-draw), hg, Kerberos TGT (krbtgt), kubernetes-context, libreview, mac-player, mpc, network, network-public-ip, network-bandwidth, network-ping, network-vpn, playerctl, ram-usage, spotify-tui, spr, ssh-session, synchronize-panes, sys-temp, terraform, time, tmux-ram-usage, uptime, weather, custom:script-name
set -g @dracula-plugins "cpu-usage ram-usage time"

# Left icon can be `hostname` (full hostname), `session`, `shortname` (short name), `smiley`, `window`, or any character.
set -g @dracula-show-left-icon "session"

# Save pane contents so they can be restored
set -g @resurrect-capture-pane-contents "on"

# Automatically restore the last saved environment on start
set -g @continuum-restore "on"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run "~/.tmux/plugins/tpm/tpm"
